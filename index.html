<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smart Todo Master</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="todo-app">
      <h2>Smart Todo App</h2>

      <!-- Input Section -->
      <div class="input-section">
        <input type="text" id="task-input" placeholder="Enter a new task..." />
        <button id="add-btn">Add Task</button>
      </div>

      <!-- Filter Controls -->
      <div class="filter-section">
        <button class="filter-btn active" id="filter-all">All</button>
        <button class="filter-btn" id="filter-active">Active</button>
        <button class="filter-btn" id="filter-completed">Completed</button>
        <button id="clear-completed-btn">Clear Completed</button>
      </div>

      <!-- Task List -->
      <ul id="task-list"></ul>
    </div>

    <script src="dom.js"></script>
  </body>
</html>
